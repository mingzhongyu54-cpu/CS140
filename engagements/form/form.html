<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        <h1>MingZhong's Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <h2>Sign Up</h2>
        
        
        <form action="formprocessing.html" method="post">
            <fieldset>
                <legend>Account</legend>
                <div class="form-row">
                    <label for="personname">Full Name :</label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name">
                </div>
                <div class="form-row">
                    <label for="personemail">Email :</label>
                    <input id="personemail" type="email" name="email" placeholder="Email">
                </div>
                <div class="form-row">
                    <label for="birthdate">Date of Birth:</label>
                    <input id="birthdate" type="date" name="birthdate">
                </div>
                <div class="form-row">
                    <label for="personpassword">Password :</label>
                    <input id="personpassword" type="password" name="pass">
                </div>
                <div class="form-row">
                    <label for="state">State</label>
                    <select name="state" id="state">
                        <option value="blank">--------</option>
                        <option value="CA">Califonia</option>
                        <option value="HI">Hawaii</option>
                        <option value="UT">Utah</option>
                    </select>
                </div>
                <div class="form-row">
                    <label><input type="checkbox" name="remmber">Remember Me?</label>
                </div>
                <fieldset>
                    <legend>Select your Gender:</legend>

                    <label>
                        <input type="radio" name="gender" value="man">Man
                    </label>
                    <label>
                        <input type="radio" name="gender" value="female">female
                    </label>
                </fieldset>
                <div class="form-row">
                <label for="comments">Comments</label>
                <textarea name="comments" id="comments"></textarea>
                </div>
                <div class="form-row">
                <input type="submit">
                </div>
            </fieldset>   
        </form>
    </main>
    <footer>
    <p>&copy; 2026 MingZhong Yu</p>
    </footer> 
</body> 
</html>
